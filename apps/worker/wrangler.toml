name = "university-grievance-api"
main = "src/index.ts"
compatibility_date = "2026-05-22"

routes = [
  { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" }
]

[vars]
FRONTEND_URL = "https://yourdomain.com"
ALLOWED_EMAIL_DOMAIN = "youruniversity.edu"
ALLOWED_EMAIL_DOMAINS = "youruniversity.edu"
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
SESSION_TTL_SECONDS = "604800"
ISSUE_EDIT_WINDOW_MINUTES = "30"
DUPLICATE_LIKELY_THRESHOLD = "0.78"
DUPLICATE_RELATED_THRESHOLD = "0.55"
INITIAL_PORTAL_ADMIN_EMAIL = "admin@youruniversity.edu"

[[d1_databases]]
binding = "DB"
database_name = "university-grievance-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "university-grievance-attachments"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "grievance-notifications"

[[queues.consumers]]
queue = "grievance-notifications"

[[durable_objects.bindings]]
name = "ISSUE_ROOMS"
class_name = "IssueRoom"

[[durable_objects.bindings]]
name = "NOTIFICATION_HUB"
class_name = "NotificationHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IssueRoom", "NotificationHub"]

[env.local]
FRONTEND_URL = "http://localhost:3000"
ALLOWED_EMAIL_DOMAINS = "youruniversity.edu"
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
