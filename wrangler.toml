name = "university-grievance-api"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-05-22"

[vars]
FRONTEND_URL = "https://rutownhall.live"
ALLOWED_EMAIL_DOMAIN = "rishihood.edu.in"
ALLOWED_EMAIL_DOMAINS = "rishihood.edu.in"
SESSION_TTL_SECONDS = "604800"
ISSUE_EDIT_WINDOW_MINUTES = "30"
DUPLICATE_LIKELY_THRESHOLD = "0.78"
DUPLICATE_RELATED_THRESHOLD = "0.55"
INITIAL_PORTAL_ADMIN_EMAIL = "admin@nst.rishihood.edu.in"

[[d1_databases]]
binding = "DB"
database_name = "university-grievance-db"
database_id = "92eaa9b4-14fc-4922-b64e-20a77b72336b"

[[kv_namespaces]]
binding = "KV"
id = "57f2676ccf39436593c02d240ad82f40"

[[r2_buckets]]
binding = "R2"
bucket_name = "university-grievance-attachments"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "grievance-notifications"

[[queues.consumers]]
queue = "grievance-notifications"

[[durable_objects.bindings]]
name = "ISSUE_ROOMS"
class_name = "IssueRoom"

[[durable_objects.bindings]]
name = "NOTIFICATION_HUB"
class_name = "NotificationHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IssueRoom", "NotificationHub"]
